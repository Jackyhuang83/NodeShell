name: Refresh v0.1 lockfile

on:
  push:
    branches: [v0.1-slim]
    paths:
      - ".github/workflows/refresh-v01-lockfile.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.1-slim
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: |
          git config user.name "NodeShell Lockfile"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "build: refresh slim v0.1 lockfile"
          git push origin HEAD:v0.1-slim
