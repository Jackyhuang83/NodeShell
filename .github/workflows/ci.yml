name: NodeShell CI

on:
  push:
    branches: [security-baseline, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run type-check
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test
