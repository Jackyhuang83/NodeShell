name: NodeShell CI

on:
  push:
    branches: [security-baseline, phase1b-final, main]
  pull_request:
    branches: [security-baseline, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run type-check
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test
